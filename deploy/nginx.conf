# ─────────────────────────────────────────────────────────────
# Nginx 설정 — 도제학생 익명 신고 게시판
#
# 핵심(보안): 신고자 IP를 access log에 남기지 않는다.
#   방법 1) 아래처럼 IP를 제거한 log_format을 사용 (기본 채택)
#   방법 2) 아예 access_log off; 로 끄기 (더 강력, 아래 주석 참고)
#
# 배치 위치(예): /etc/nginx/sites-available/report  -> sites-enabled 로 심볼릭 링크
# ─────────────────────────────────────────────────────────────

# IP를 남기지 않는 로그 포맷. $remote_addr(클라이언트 IP)를 넣지 않는다.
# 대신 시간/요청/상태/UA 정도만 남긴다. (신고자 역추적 불가)
log_format anonymized '- - [$time_local] "$request" $status $body_bytes_sent';

# 업스트림: Gunicorn (unix 소켓으로 연결)
upstream report_app {
    server unix:/run/gunicorn/report.sock;
}

# HTTP(80): 전부 HTTPS로 리다이렉트 (+ certbot 인증 경로만 예외)
server {
    listen 80;
    server_name report.school.example.com;   # ← 실제 도메인으로 교체

    # Let's Encrypt(certbot) 도메인 인증용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443)
server {
    listen 443 ssl;
    http2 on;
    server_name report.school.example.com;   # ← 실제 도메인으로 교체

    # --- IP 익명화: 신고자 IP를 로그에 남기지 않는다 ---
    access_log /var/log/nginx/report.access.log anonymized;
    # (완전 비활성화를 원하면 위 줄을 지우고 아래 줄로 대체)
    # access_log off;
    error_log /var/log/nginx/report.error.log;

    # --- TLS 인증서 (certbot이 발급/자동 교체) ---
    ssl_certificate     /etc/letsencrypt/live/report.school.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.school.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 5m;

    # 정적 파일 (collectstatic 결과물)
    location /static/ {
        alias /home/ubuntu/AWS-project/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://report_app;

        # Django가 HTTPS 여부를 알 수 있도록 스킴을 전달 (SECURE_PROXY_SSL_HEADER와 짝)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # 중요: 신고자 IP를 앱으로 넘기지 않는다.
        #   일반적으로는 X-Forwarded-For / X-Real-IP 로 실제 IP를 전달하지만,
        #   이 프로젝트는 IP를 수집하지 않는 것이 원칙이므로 '전달하지 않는다'.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }
}
